# ============================================================================
# O.M.V 工作台 · 全域广播 —— nginx 同源公网反代样例（Phase 2）
#
# 拓扑（同一域名）：
#   浏览器 ──HTTPS/WSS──> nginx ──/api/、/socket.io/──> api:3000（NestJS）
#                              └──其余──────────────> web:3100（Next.js）
#
# 使用前必改：
#   - server_name / ssl_certificate / ssl_certificate_key
#   - upstream api / web 的地址（同机 compose 用容器名；裸机用 127.0.0.1:端口）
# 后端需 TRUST_PROXY=true（nginx 会设置 X-Forwarded-For）。
# S3/MinIO 不反代：预签名 URL 的 host/path 被 SigV4 签名，需独立端口/子域。
#
# 本文件是可直接 `nginx -c /path/to/nginx.conf` 的完整主配置；
# 若只作为站点配置 include 到系统 nginx 的 http{} 内，请取 map/upstream/server
# 三段（去掉 worker_processes/events/http 外壳）。
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

# WebSocket 升级：有 Upgrade 头则转发 upgrade，否则保持普通 HTTP
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dijiang_api {
    # 多实例：在这里加多个 server，并配合 sticky（见 proxy_cookie / ip_hash 注释）
    server api:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream dijiang_web {
    server web:3100 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# 可选：为 Socket.IO 长轮询做会话保持（多实例时）
# upstream dijiang_api {
#     ip_hash;
#     server api1:3000;
#     server api2:3000;
# }

server {
    listen 80;
    listen [::]:80;
    server_name dijiang.example.com;
    # Let's Encrypt HTTP-01（certbot webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dijiang.example.com;

    ssl_certificate     /etc/letsencrypt/live/dijiang.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dijiang.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传：与 REQUEST_BODY_LIMIT_MB（默认 2MB）及附件上限对齐；
    # 文件直传走 S3 预签名，这里不需要放开到 GB 级。
    client_max_body_size 20m;

    # ── 安全响应头 ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 日志带上真实客户端 IP（$remote_addr 已是 XFF 前的对端；后端取 XFF）
    access_log /var/log/nginx/dijiang.access.log;
    error_log  /var/log/nginx/dijiang.error.log warn;

    # ── WebSocket（Socket.IO 传输层）─────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://dijiang_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── REST API（含 AI SSE 流）──────────────────────────────────────────
    location /api/ {
        proxy_pass http://dijiang_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # SSE：不缓冲，立即下发
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 运维探针 ─────────────────────────────────────────────────────────
    location = /healthz { proxy_pass http://dijiang_api; proxy_set_header Host $host; }
    location = /readyz  { proxy_pass http://dijiang_api; proxy_set_header Host $host; }
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://dijiang_api;
        proxy_set_header Host $host;
    }

    # ── 前端（Next.js 生产服务）──────────────────────────────────────────
    location / {
        proxy_pass http://dijiang_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # 静态导出（仅 next export 时）：注释上面的 location /，改用：
    # root /srv/web;
    # index index.html;
    # location / { try_files $uri $uri.html $uri/ /index.html; }
}
} # http
